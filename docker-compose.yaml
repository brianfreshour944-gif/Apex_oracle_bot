services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    # NOTE: no `container_name` here -- Coolify renames services per deploy and
    # a fixed name collides with leftover containers ("name already in use").
    restart: unless-stopped
    volumes:
      # Named volume instead of a ./data bind mount: on Coolify a relative
      # bind mount resolves against the ephemeral per-deploy /artifacts dir,
      # which would wipe the trade DB / crash-recovery state on every redeploy.
      - bot_data:/app/data
    # `expose` (not `ports`): Coolify's Traefik proxy routes the configured
    # FQDN to this container. Publishing a fixed host port (8000:8000) collides
    # with the previous deployment's container and any other app on the host.
    expose:
      - "8000"
    healthcheck:
      # Python stdlib check (the image no longer installs curl)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      # The bot imports torch and loads model weights before /health is up;
      # give it headroom so startup isn't marked unhealthy prematurely.
      start_period: 90s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data: