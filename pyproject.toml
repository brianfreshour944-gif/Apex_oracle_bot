[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The project name (apex-oracle-bot) doesn't match any directory at the repo
# root, and hatchling can't infer what to package from that -- pip install -e .
# fails at the metadata-generation step before it ever gets to resolving
# dependencies. The actual code lives in src/, imported throughout as
# `from src.xxx import yyy`, so ship src/ as-is (keeping its name) rather
# than renaming/relocating it.
packages = ["src"]

[project]
name = "apex-oracle-bot"
version = "2.0.0"
description = "Modern production-grade trading bot with state-of-the-art Python practices"
authors = [
    {name = "Apex Oracle Bot", email = "bot@apexoracle.com"},
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    # alpaca-py, not the legacy alpaca-trade-api package -- src/exchange.py
    # imports from alpaca.trading.*/alpaca.data.*, which only exist in
    # alpaca-py. Kept in sync with requirements.txt's own alpaca-py pin.
    "alpaca-py>=0.30.0",
    "numpy==2.5.0",
    "polars==1.42.1",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "httpx==0.28.1",
    "pydantic-settings==2.14.2",
    "fastapi==0.139.2",
    "uvicorn==0.49.0",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "psycopg2-binary==2.9.12",
    "websockets>=13.0",

    "redis==5.2.1",
    "typer==0.15.1",
    # feature_engineering.py's spearman/kendall correlation path,
    # bayesian_optimizer.py, and feature_drift_monitor.py's KS test all
    # import this directly with no fallback for spearman/kendall -- missing
    # from both manifests until now, so a clean install would raise
    # ImportError the first time either path is hit. Found via an external
    # correctness audit, 2026-09-22.
    "scipy>=1.11.0",
    # pandas is imported unconditionally by src/feature_engineering.py, which
    # bot.py loads on every startup, and torch is pulled in unconditionally by
    # src/committee/committee.py -> decision_transformer.py. Both were only
    # declared in requirements.txt (and pandas only under the dev extra), so a
    # clean `pip install .` produced an ImportError at import time.
    "pandas>=2.2.0",
    "torch>=2.2.0",
]

[project.scripts]
apex-bot = "src.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.4",
    "mypy>=1.9.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "types-psycopg2>=2.9.21",
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print
    "PYI",  # flake8-pyi
    "RUF",  # ruff-specific rules
]
ignore = ["E501"]

# T201 (flake8-print) is kept enabled for importable library code, where
# stdout output should go through the structured logger instead. It is
# disabled for the surfaces whose entire job is console output: CLI tools,
# audit/report/verification scripts, tests, the Kaggle notebook, and the
# `if __name__ == "__main__"` self-test/demo entry points.
#
# E402 (module-import-not-at-top) is disabled for those same entry points:
# each one bootstraps the repo root onto sys.path (PROJECT_ROOT =
# Path(__file__).parent.parent; sys.path.insert(0, ...)) before it can
# `from src... import ...`, so the late imports are deliberate, not sloppy.
# Importable `src/` modules are unaffected and must keep imports at the top.
[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201", "E402"]
"tests/*" = ["T201"]
"kaggle_llm_pipeline/*" = ["T201", "E402"]
"audit_*.py" = ["T201", "E402"]
"verify_*.py" = ["T201", "E402"]
"measure_*.py" = ["T201"]
"run_*.py" = ["T201", "E402"]
"scan_learning.py" = ["T201", "E402"]
"sweep_params.py" = ["T201"]
"security_check.py" = ["T201"]
"soak_test_plan.py" = ["T201"]
"vuln_check.py" = ["T201"]
"rate_limit_analysis.py" = ["T201"]
"remove_tunnel_protocol.py" = ["T201"]
"src/alerting.py" = ["T201"]
"src/backtest.py" = ["T201"]
"src/bayesian_optimizer.py" = ["T201"]
"src/bot.py" = ["T201"]
"src/committee/batch_ensemble.py" = ["T201"]
"src/committee/bayesian_transformer.py" = ["T201"]
"src/committee/decision_transformer.py" = ["T201"]
"src/committee/hierarchical_skills.py" = ["T201"]
"src/logging_config.py" = ["T201"]
"src/main.py" = ["T201"]
"src/ood_discriminator.py" = ["T201"]
"src/population_trainer.py" = ["T201"]
"src/walkforward.py" = ["T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"