[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apex-oracle-bot"
version = "2.0.0"
description = "Modern production-grade trading bot with state-of-the-art Python practices"
authors = [
    {name = "Apex Oracle Bot", email = "bot@apexoracle.com"},
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "alpaca-trade-api==3.2.0",
    "numpy==2.5.0",
    "polars==1.42.1",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "httpx==0.28.1",
    "pydantic-settings==2.14.2",
    "fastapi==0.139.2",
    "uvicorn==0.49.0",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "psycopg2-binary==2.9.12",
    "websockets==10.4",

    "redis==5.2.1",
    "typer==0.15.1",
]

[project.scripts]
apex-bot = "src.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.4",
    "mypy>=1.9.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "types-psycopg2>=2.9.21",
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "T20",  # flake8-print
    "PYI",  # flake8-pyi
    "RUF",  # ruff-specific rules
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"